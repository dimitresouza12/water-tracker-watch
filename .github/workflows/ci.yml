name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Testes da lógica
        run: swift test

  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar o app do relógio
        run: >
          xcodebuild
          -project WaterTracker.xcodeproj
          -target "WaterTracker Watch App"
          -sdk watchsimulator
          -configuration Debug
          build CODE_SIGNING_ALLOWED=NO
